
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Marks Calculator</h1>

        <input type="text" id="name" placeholder="Enter Student Name">
        <input type="number" id="m1" placeholder="English Marks (0-100)">
        <input type="number" id="m2" placeholder="Math Marks (0-100)">
        <input type="number" id="m3" placeholder="Computer Marks (0-100)">

        <button onclick="calculate()">Calculate Result</button>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
